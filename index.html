<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban and Rural in Yguazú — Census 2022</title>
    <meta name="description" content="Urban and rural census areas of Yguazú, Alto Paraná, Paraguay, with their 2022 populations, building footprints and a Sentinel-2 satellite image." />
  </head>
  <body>
    <div class="app">
      <header class="head">
        <div class="head-text">
          <h1 data-t="title"></h1>
          <span class="place" data-t="place"></span>
        </div>
        <div class="head-side">
          <a class="tag" href="https://shinyanakashima.github.io/30daymapchallenge/" target="_blank" rel="noopener">#30DayMapChallenge · Day 9</a>
          <div id="lang" class="seg lang" role="group" aria-label="Language / Idioma / 言語"></div>
        </div>
      </header>

      <main class="map-wrap">
        <div id="map" aria-label="Map of urban and rural census areas in Yguazú"></div>
        <div class="map-tools" role="toolbar">
          <div class="seg" role="group">
            <button type="button" id="view-satellite" data-t="viewSatellite" aria-pressed="true" disabled></button>
            <button type="button" id="view-census" data-t="viewCensus" aria-pressed="false" disabled></button>
          </div>
          <label class="check"><input type="checkbox" id="show-buildings" disabled /> <span data-t="showBuildings"></span></label>
          <label class="check"><input type="checkbox" id="show-roads" disabled /> <span data-t="showRoads"></span></label>
          <span class="tools-sep" aria-hidden="true"></span>
          <button type="button" class="quiet" id="zoom-urban" data-t="zoomUrban" disabled></button>
          <button type="button" class="quiet" id="reset" data-t="reset" disabled></button>
          <button type="button" class="quiet" id="locate" data-t="locate" disabled></button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </main>

      <aside class="panel">
        <p class="lead" data-t="lead"></p>

        <section class="compare" aria-label="Population and buildings">
          <table class="cmp">
            <thead>
              <tr>
                <th scope="col"></th>
                <th scope="col"><span data-t="colPopulation"></span><small data-t="colPopulationNote"></small></th>
                <th scope="col"><span data-t="colBuildings"></span><small data-t="colBuildingsNote"></small></th>
              </tr>
            </thead>
            <tbody>
              <tr data-area="urban">
                <th scope="row"><span class="sw sw-urban"></span><span data-t="urban"></span></th>
                <td><strong id="pop-urban">—</strong><span class="pct" id="pct-urban"></span></td>
                <td><strong id="bld-urban">—</strong><span class="pct" id="bld-pct-urban"></span></td>
              </tr>
              <tr data-area="rural">
                <th scope="row"><span class="sw sw-rural"></span><span data-t="rural"></span></th>
                <td><strong id="pop-rural">—</strong><span class="pct" id="pct-rural"></span></td>
                <td><strong id="bld-rural">—</strong><span class="pct" id="bld-pct-rural"></span></td>
              </tr>
              <tr class="total">
                <th scope="row" data-t="total"></th>
                <td><strong id="pop-total">—</strong></td>
                <td><strong id="bld-total">—</strong></td>
              </tr>
            </tbody>
          </table>
          <p class="bld-status" id="bld-status"></p>

          <div class="bars">
            <div class="bar-row">
              <span class="bar-name" data-t="colPopulation"></span>
              <div class="bar" role="img" id="bar">
                <div class="bar-urban" id="bar-urban"></div>
                <div class="bar-rural" id="bar-rural"></div>
              </div>
            </div>
            <div class="bar-row" id="bld-chart" hidden>
              <span class="bar-name" data-t="colBuildings"></span>
              <div class="bar" role="img" id="bld-bar">
                <div class="bar-urban" id="bld-bar-urban"></div>
                <div class="bar-rural" id="bld-bar-rural"></div>
              </div>
            </div>
            <p class="bar-note" data-t="barsNote"></p>
          </div>
        </section>

        <ul class="legend">
          <li><span class="sw sw-urban"></span><span data-t="legendUrban"></span></li>
          <li><span class="sw sw-rural"></span><span data-t="legendRural"></span></li>
          <li><span class="sw sw-building"></span><span data-t="legendBuilding"></span></li>
          <li><span class="sw sw-road"></span><span data-t="legendRoad"></span></li>
          <li><span class="sw sw-road-minor"></span><span data-t="legendRoadMinor"></span></li>
          <li><span class="sw sw-outside"></span><span data-t="legendOutside"></span></li>
        </ul>
        <p class="hint" data-t="hint"></p>

        <section class="sv" aria-labelledby="sv-title">
          <h2 id="sv-title" data-t="svTitle"></h2>
          <ol class="sv-list" id="sv-list"></ol>
          <p class="sv-note" data-t="svNote"></p>
        </section>


        <details class="fold">
          <summary data-t="notesTitle"></summary>
          <p data-t="note1"></p>
          <p data-t="note2"></p>
          <p data-t="note3"></p>
          <p data-t="bldNote"></p>
          <p data-t="note4"></p>
        </details>

        <details class="fold source">
          <summary data-t="sourceTitle"></summary>
          <p data-t="source"></p>
          <p data-t="processing"></p>
          <p data-t="license"></p>
          <p data-t="srcBuildings"></p>
          <p data-t="srcSatellite"></p>
          <p data-t="srcBasemap"></p>
          <p class="links">
            <a href="https://www.ine.gov.py/microdatos/cartografia-digital-2022.php" target="_blank" rel="noopener">INE Cartografía digital 2022</a>
            · <a href="https://www.ine.gov.py/microdatos/license.php" target="_blank" rel="noopener">INE License</a>
            · <a href="https://docs.overturemaps.org/attribution/" target="_blank" rel="noopener">Overture Maps</a>
            · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
            · <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a>
            · <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a>
            · <a href="https://sentinels.copernicus.eu/documents/247904/690755/Sentinel_Data_Legal_Notice" target="_blank" rel="noopener">Copernicus Sentinel data</a>
          </p>
        </details>
        <p class="src-short"><span data-t="srcShort"></span> · <a href="https://github.com/shinyanakashima/30daymapchallenge-2026day9-campo-ciudad" target="_blank" rel="noopener">GitHub</a></p>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
